# Settings of the decision code (forecasts, planner, experiments). Nothing here is hidden truth.

[forecast]
num_leaves = 31
learning_rate = 0.05
n_estimators = 400
min_child_samples = 40
# Lost demand: an app open with no scooter nearby counts as a ride lost at the conversion rate seen in
# the same zone type and hour when scooters were nearby.
min_nearby_opens = 30

[planner]
rentable_battery_pct = 15.0  # product rule: the app hides scooters below this charge
horizon_hours = 14           # demand the plan serves before the next shift moves things again (night 3-16, midday 13-26)
low_battery_pct = 30.0       # below this a scooter is expected to die within the horizon
low_battery_weight = 0.5
arrival_weight = 1.0
move_cost_weight = 1.0
margin_lookback_days = 14

[heuristic]
# The status quo the planner replaces: swap the emptiest batteries, move scooters towards the zones that
# had the most ride starts in the last two weeks.
lookback_days = 14
swap_below_pct = 30.0

[eval]
seeds = [101, 202, 303]
bootstrap = 2000
block_days = 7

[pricing]
test_multiplier = 1.2
replications = 10
experiment_days = 28
switchback_hours = 2
burn_in_hours = 1
# Price levels for the elasticity switchback and the bands a price policy may use.
levels = [0.9, 1.0, 1.15, 1.3]
bands = ["weekday_peak", "weekday_offpeak", "weekend"]
min_ride_share = 0.92        # a price policy must keep at least this share of base rides (city agreements)

[did]
treated_x_from = 8           # the eastern third, where the operator saw a competitor launch
event_date = "2025-06-16"

[costs]
# Business numbers the operator knows (finance), used by the planner's objective.
ride_variable_cost_eur = 0.35
swap_cost_eur = 2.6
move_cost_eur = 2.1

[sensing]
train_windows = 24000
val_windows = 4000
test_windows = 6000
epochs = 10
lr = 0.004
batch = 256
seed = 5
# Riding policy on the scooter: warn, then slow down, after `consecutive` sidewalk windows in a row (2 s each).
consecutive = 3
# The threshold is the lowest that keeps false slowdowns on roads at or below this rate (chosen on val).
max_false_slowdowns_per_100km = 1.0
tandem_precision_target = 0.90
rides = 300                   # simulated rides for the ride-level scoring
ride_windows = 120            # 4 minutes per ride
