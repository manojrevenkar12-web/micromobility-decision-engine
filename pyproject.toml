[project]
name = "mde"
version = "1.0.0"
description = "Fleet decisions for shared e-scooters"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "scipy>=1.11", "lightgbm>=4.3", "scikit-learn>=1.4", "torch>=2.3", "onnx>=1.16", "onnxruntime>=1.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
